name: Tests

on:
  pull_request:
  push:

env:
  PROJECT: SanePeek.xcodeproj
  SCHEME: SanePeek
  DESTINATION: platform=macOS

jobs:
  unit:
    name: Unit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan SanePeek \
            -configuration Debug \
            -destination "$DESTINATION" \
            -only-testing:SanePeekTests \
            -skip-testing:SanePeekTests/SMCTemperatureAdapterHardwareTests \
            -enableCodeCoverage YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -collect-test-diagnostics on-failure \
            -resultBundlePath artifacts/unit.xcresult \
            2>&1 | tee artifacts/unit.log
      - name: Upload unit diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: artifacts/

  ui:
    name: UI tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run serial UI journeys
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan SanePeek \
            -configuration Debug \
            -destination "$DESTINATION" \
            -only-testing:SanePeekUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -collect-test-diagnostics on-failure \
            -resultBundlePath artifacts/ui.xcresult \
            2>&1 | tee artifacts/ui.log
      - name: Upload UI diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-diagnostics
          path: artifacts/

  performance:
    name: Performance tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run performance measurements
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -testPlan SanePeek \
            -configuration Debug \
            -destination "$DESTINATION" \
            -only-testing:SanePeekPerformanceTests \
            -enablePerformanceTestsDiagnostics YES \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 300 \
            -collect-test-diagnostics on-failure \
            -resultBundlePath artifacts/performance.xcresult \
            2>&1 | tee artifacts/performance.log
      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-diagnostics
          path: artifacts/
